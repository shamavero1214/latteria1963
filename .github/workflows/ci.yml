name: Latteria source checks
on:
  push:
    paths:
      - "server.js"
      - "test/**"
      - "src/**"
      - "package*.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "server.js"
      - "test/**"
      - "src/**"
      - "package*.json"
      - ".github/workflows/ci.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
